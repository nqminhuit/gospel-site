name: Check readings

# Daily monitor for the committed resources/bible.db snapshot.
#
# If upcoming readings are missing, it tries to sync a fresh bible.db from
# daily-bible and opens a PR when that fixes it — so being merely out of date
# heals itself. It only fails, and only notifies, when the data is missing
# upstream too, which is the case that actually needs a human.
#
# The site itself never fetches anything at runtime; this sync happens in CI,
# and only after the check has already failed.

on:
  schedule:
    - cron: '10 00 * * *'
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
    inputs:
      lookahead_days:
        description: 'How many days ahead to require readings for'
        required: false
        default: '2'

permissions:
  contents: write
  pull-requests: write

env:
  LOOKAHEAD_DAYS: ${{ inputs.lookahead_days || '2' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Check upcoming readings
        id: check
        continue-on-error: true
        run: npm run check-readings

      - name: Sync bible.db from daily-bible
        if: steps.check.outcome == 'failure'
        run: ./.github/scripts/sync-bible-db.sh

      - name: Re-check after sync
        id: recheck
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        run: npm run check-readings

      - name: Check for database changes
        id: changes
        if: steps.check.outcome == 'failure'
        run: |
          if git diff --quiet resources/bible.db; then
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          fi

      # Open a PR whenever the sync changed anything, even if some dates are
      # still missing — fresher data is worth landing either way.
      - name: Create Pull Request
        if: steps.changes.outputs.CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Falls back to the default token if no CREATE_PR secret is set, which
          # needs "Allow GitHub Actions to create and approve pull requests"
          # enabled in the repository settings.
          token: ${{ secrets.CREATE_PR || github.token }}
          branch: auto/sync-bible-db
          title: 'Sync bible.db from daily-bible'
          body: |
            Readings were missing for the next ${{ env.LOOKAHEAD_DAYS }} day(s),
            so `resources/bible.db` was re-synced from `daily-bible`.

            Generated by the `Check readings` workflow.
          commit-message: 'Sync bible.db from daily-bible'
          add-paths: resources/bible.db
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      # Only alert when syncing didn't help — daily-bible doesn't have these
      # readings either, so its own "Heal missing readings" workflow needs to
      # crawl them (or the source hasn't published them yet).
      - name: Fail if readings are still missing
        if: steps.recheck.outcome == 'failure'
        run: |
          echo "::error::Readings still missing after syncing from daily-bible — run its 'Heal missing readings' workflow."
          exit 1
