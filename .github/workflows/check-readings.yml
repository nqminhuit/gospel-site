name: Check readings

# Daily monitor for the committed resources/bible.db snapshot.
#
# If upcoming readings are missing, it syncs a fresh bible.db from daily-bible
# and commits it straight to the default branch, which redeploys the site — so
# being merely out of date heals itself with no human in the loop. It only
# fails, and only notifies, when the data is missing upstream too, which is the
# case that actually needs a person.
#
# The site itself never fetches anything at runtime; this sync happens in CI,
# and only after the check has already failed.

on:
  schedule:
    - cron: '10 00 * * *'
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
    inputs:
      lookahead_days:
        description: 'How many days ahead to require readings for'
        required: false
        default: '2'

permissions:
  contents: write

env:
  LOOKAHEAD_DAYS: ${{ inputs.lookahead_days || '2' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Check upcoming readings
        id: check
        continue-on-error: true
        run: npm run check-readings

      - name: Sync bible.db from daily-bible
        if: steps.check.outcome == 'failure'
        run: ./.github/scripts/sync-bible-db.sh

      - name: Re-check after sync
        id: recheck
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        run: npm run check-readings

      # Commit whenever the sync changed anything, even if some dates are still
      # missing — fresher data is worth deploying either way. Pushing to the
      # default branch is what triggers the Vercel redeploy.
      - name: Commit synced database
        if: steps.check.outcome == 'failure'
        env:
          MESSAGE: 'Sync bible.db from daily-bible'
        run: ./.github/scripts/commit-db.sh

      # Only alert when syncing didn't help — daily-bible doesn't have these
      # readings either, so its own "Heal missing readings" workflow needs to
      # crawl them (or the source hasn't published them yet).
      - name: Fail if readings are still missing
        if: steps.recheck.outcome == 'failure'
        run: |
          echo "::error::Readings still missing after syncing from daily-bible — run its 'Heal missing readings' workflow."
          exit 1
